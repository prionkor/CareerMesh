services:
  postgres:
    image: postgres:18
    container_name: careermesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careermesh}
      POSTGRES_USER: ${DB_USER:-careermesh}
      POSTGRES_PASSWORD: ${DB_PASS:-careermesh}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-careermesh} -d ${DB_NAME:-careermesh}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
